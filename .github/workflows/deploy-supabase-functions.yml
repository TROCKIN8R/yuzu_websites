name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          STM_API_KEY: ${{ secrets.STM_API_KEY }}
          STUDY_KIT_DRAFT_PEPPER: ${{ secrets.STUDY_KIT_DRAFT_PEPPER }}
          STUDY_KIT_DRAFT_ENCRYPTION_KEY: ${{ secrets.STUDY_KIT_DRAFT_ENCRYPTION_KEY }}
        run: |
          if [ -n "${TURNSTILE_SECRET_KEY}" ]; then
            supabase secrets set "TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}" --project-ref mwgbeolcgigvpufjmodz
            echo "Synced TURNSTILE_SECRET_KEY to Supabase."
          else
            echo "::warning::GitHub secret TURNSTILE_SECRET_KEY is not set. Captcha verification will fail until it is added."
          fi
          if [ -n "${STM_API_KEY}" ]; then
            supabase secrets set "STM_API_KEY=${STM_API_KEY}" --project-ref mwgbeolcgigvpufjmodz
            echo "Synced STM_API_KEY to Supabase."
          else
            echo "::warning::GitHub secret STM_API_KEY is not set. STM live demo will fail until it is added."
          fi
          if [ -n "${STUDY_KIT_DRAFT_PEPPER}" ] && [ -n "${STUDY_KIT_DRAFT_ENCRYPTION_KEY}" ]; then
            supabase secrets set \
              "STUDY_KIT_DRAFT_PEPPER=${STUDY_KIT_DRAFT_PEPPER}" \
              "STUDY_KIT_DRAFT_ENCRYPTION_KEY=${STUDY_KIT_DRAFT_ENCRYPTION_KEY}" \
              --project-ref mwgbeolcgigvpufjmodz
            echo "Synced study-permit-kit draft encryption secrets to Supabase."
          else
            echo "::warning::STUDY_KIT_DRAFT_PEPPER / STUDY_KIT_DRAFT_ENCRYPTION_KEY not set in GitHub. Draft save/resume will fail."
          fi

      - name: Deploy opportunity-intake
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy opportunity-intake --project-ref mwgbeolcgigvpufjmodz

      - name: Deploy refresh-watchdog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy refresh-watchdog --project-ref mwgbeolcgigvpufjmodz

      - name: Deploy contract-router
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy contract-router --project-ref mwgbeolcgigvpufjmodz

      - name: Deploy stm-proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy stm-proxy --project-ref mwgbeolcgigvpufjmodz

      - name: Deploy imm1294-filler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy imm1294-filler --project-ref mwgbeolcgigvpufjmodz

      - name: Deploy study-permit-kit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_AUTOMATION }}
        run: supabase functions deploy study-permit-kit --project-ref mwgbeolcgigvpufjmodz
